[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgeai-backend"
version = "1.0.0"
description = "ForgeAI Studio backend — autonomous multi-agent software engineering platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# Runtime dependencies are managed explicitly in requirements.txt.

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Depends(...) and Depends-provided defaults are the standard FastAPI injection pattern.
"app/api/**" = ["B008"]
"app/main.py" = ["B008"]
# Alembic env.py must insert the project root into sys.path before importing the app.
"alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
